x-app: &app
  image: ${APP_IMAGE:-deno-effect-template:local}
  build:
    context: .
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-deno_effect}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgresql:5432/${POSTGRES_DB:-deno_effect}
    API_HOST: 0.0.0.0
    API_PORT: "8000"

services:
  postgresql:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deno_effect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-deno_effect}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
      ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  migrate:
    <<: *app
    command: ["task", "db:migrate"]
    restart: "no"
    depends_on:
      postgresql:
        condition: service_healthy

  api:
    <<: *app
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - "const response = await fetch('http://127.0.0.1:8000/health'); Deno.exit(response.ok ? 0 : 1);"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    <<: *app
    command: ["task", "container:worker"]
    restart: "no"
    profiles: ["tools"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
