services:
  postgresql:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: deno_effect
      POSTGRES_PASSWORD: deno_effect
      POSTGRES_USER: deno_effect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deno_effect -d deno_effect"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  postgres_data:
