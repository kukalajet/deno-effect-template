name: Docker CI and VPS deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, test, and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.reference.outputs.image_ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Image metadata
        id: metadata
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "deno_version=$(cat .dvmrc)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image and run quality checks
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: deno-effect-template:ci
          build-args: DENO_VERSION=${{ steps.metadata.outputs.deno_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test API, migrations, worker, and persistent database
        env:
          APP_IMAGE: deno-effect-template:ci
        run: bash scripts/smoke-docker.sh
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned image for Intel and ARM VPS hosts
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: DENO_VERSION=${{ steps.metadata.outputs.deno_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image reference
        id: reference
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ${{ steps.metadata.outputs.image }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "image_ref=$IMAGE_NAME@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy API to VPS
    needs: build
    if: >-
      vars.VPS_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: vps-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Upload and activate release
        env:
          APP_IMAGE: ${{ needs.build.outputs.image_ref }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set the VPS_HOST variable}"
          : "${VPS_USER:?Set the VPS_USER variable}"
          : "${VPS_SSH_KEY:?Set the VPS_SSH_KEY secret}"
          : "${VPS_KNOWN_HOSTS:?Set the VPS_KNOWN_HOSTS secret}"

          ssh_dir=$(mktemp -d "$RUNNER_TEMP/vps-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"

          ssh_options=(
            -i "$ssh_dir/key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o ConnectTimeout=15
          )
          target="$VPS_USER@$VPS_HOST"
          release_id="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          archive="$RUNNER_TEMP/release-$release_id.tar.gz"
          tar -czf "$archive" docker-compose.yml
          scp "${ssh_options[@]}" -P "$VPS_PORT" "$archive" \
            "$target:release-$release_id.tar.gz"
          printf -v remote_command 'bash -s -- %q %q' "$release_id" "$APP_IMAGE"
          ssh "${ssh_options[@]}" -p "$VPS_PORT" "$target" \
            "$remote_command" < deploy/vps.sh
